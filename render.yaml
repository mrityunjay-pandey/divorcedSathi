databases:
  - name: divorcedsathi-db
    plan: free
    databaseName: divorcedsathi
    user: divorcedsathi

services:
  - type: web
    name: divorcedsathi-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: divorcedsathi-db
          property: connectionString
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_SESSION_TTL
        value: 15m
      - key: AUTH_REFRESH_TTL
        value: 30d
      # Set this to your deployed Vercel URL after the frontend is live —
      # it controls the CORS allowlist in apps/api/src/main.ts.
      - key: APP_BASE_URL
        value: https://your-app.vercel.app
